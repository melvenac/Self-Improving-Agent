name: CI

on:
  push:
    # T-227: a push triggers CI only on master. Every other branch runs on its pull request, so a branch
    # push and its PR no longer produce two runs of one SHA (T-221's cancelled-check problem, #277). A push to
    # master always runs the suite, docs-only or not (D-055 left it unfiltered). A branch with no PR runs CI
    # by workflow_dispatch.
    branches:
      - master
  pull_request:
    # D-091 (T-219): no paths filter. A workflow that never starts never reports `test`, which master's ruleset
    # (D-090) requires, so every docs-only PR was blocked forever. A docs-only PR starts the workflow and the
    # changed job decides: skip=true skips `test` at the job level, and a skipped job reports Skipped.
    # T-227: only opened and synchronize. A reopened or ready_for_review event would start a SECOND run of the
    # same head SHA, and that run would cancel the first inside the PR's concurrency group, leaving a cancelled
    # `test` on the head commit (the #277 lesson). One run per commit means only a superseded commit is cancelled.
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      tcm:
        description: "Run on the self-hosted tcm runner instead of GitHub-hosted ubuntu-latest (T-227: hosted is the default, tcm is the opt-in)"
        type: boolean
        default: false
      windows:
        description: Also run the suite on the Windows laptop runner (laptop-win; opt-in until it proves stable)
        type: boolean
        default: false
      # G-042 Step 0 (brief loop-15-slice-3-b-step0, amendment 2 R89): the suite under a generated load, on laptop-win.
      step0:
        description: "Step 0: run the Windows suite under open-brain/scripts/load-generator.mjs, with the ELD instrument on (needs windows=true)"
        type: boolean
        default: false
      workers:
        description: "--maxWorkers for the Windows suite. Empty = vitest's default on a step0 run, 2 otherwise. A step0 red-first row must leave it empty."
        type: string
        default: ""
      cpu:
        description: "step0: busy-loop processes (--cpu)"
        type: string
        default: "0"
      disk:
        description: "step0: 4 MiB write+fsync writers (--disk)"
        type: string
        default: "0"
      spawn:
        description: "step0: git --version spawn loops (--spawn)"
        type: string
        default: "0"

# T-227: concurrency is per pull request. A newer commit on a PR cancels the run of the commit it superseded and
# nothing else: the head commit's run is never cancelled, because it is the newest in its group and the PR trigger
# fires once per commit (see `types` above). A master push gets a group of its own per SHA and is never cancelled:
# two merges close together must both get a result. A dispatch has its own group per run.
concurrency:
  group: "${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || (github.event_name == 'workflow_dispatch' && format('ci-dispatch-{0}', github.run_id) || format('ci-push-{0}', github.sha)) }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  # T-178/T-227: the list of changed files comes from git diff, not from a payload. It runs on a pull request
  # only (a push is master, which always runs the suite). Any error or an empty list prints skip=false, and the
  # test job runs. skip=true only when every path is under docs/ or is README.md.
  changed:
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.tcm && fromJSON('["self-hosted", "linux", "tcm"]') || 'ubuntu-latest' }}
    outputs:
      skip: ${{ steps.diff.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        # A push diffs before..sha. A pull request diffs from the MERGE-BASE of the base and head
        # (D-091): base.sha..head.sha would also hold master's changes since the branch point and
        # keep a docs-only PR from skipping. A merge-base that cannot be computed prints an empty
        # argument, and the script reads that as skip=false, so the suite runs.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node open-brain/scripts/ci-seat-skip.mjs "$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || true)" "${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT" || echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            node open-brain/scripts/ci-seat-skip.mjs "${{ github.event.before }}" "${{ github.sha }}" >> "$GITHUB_OUTPUT" || echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    # T-227: GitHub-hosted ubuntu-latest by default (this repository is public, so its minutes are free).
    # The self-hosted tcm runner (D-043, T-192) is an opt-in: only a workflow_dispatch with tcm=true selects it.
    # The job name stays `test`, so the check D-032's merge gate reads keeps its name.
    # GitHub skips a job that needs a skipped job unless its if calls a status
    # function. !cancelled() is that call, so a pull request and a master push
    # still run test. A failed changed job is not success, so the suite runs.
    needs: changed
    if: "${{ !cancelled() && (needs.changed.result != 'success' || needs.changed.outputs.skip != 'true') }}"
    runs-on: ${{ inputs.tcm && fromJSON('["self-hosted", "linux", "tcm"]') || 'ubuntu-latest' }}

    steps:
      # The tcm runner user is firewalled to the public internet only. If any of these connects,
      # the isolation is gone and the job must not run the repository's code.
      - name: Egress isolation self-check (tcm)
        if: runner.environment == 'self-hosted'
        run: |
          fail=0
          for t in 127.0.0.1/3210 172.20.0.2/3210 172.20.0.2/3211 172.20.0.3/4000 127.0.0.1/4000 \
                   192.168.1.50/4000 100.124.212.87/4000 127.0.0.1/80 127.0.0.1/81; do
            if timeout 5 bash -c "exec 3<>/dev/tcp/$t" 2>/dev/null; then
              echo "::error::reachable from the runner: $t"; fail=1
            else
              echo "blocked: $t"
            fi
          done
          if ls /opt/doorctl >/dev/null 2>&1; then echo "::error::/opt/doorctl is readable"; fail=1; else echo "denied: /opt/doorctl"; fi
          exit "$fail"

      - uses: actions/checkout@v4
        with:
          # Full history: tests resolve revisions (git rev-parse of an older sha). The default depth of 1 failed 8 tests on
          # a hosted runner, where tcm's persistent workspace had the history (T-227 addendum, run 36984810269).
          fetch-depth: 0

      # Node 22 LTS — v24 breaks the Smart Connections Obsidian plugin, so the
      # project pins 22 everywhere to keep local and CI on the same runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: open-brain/package-lock.json

      - name: Install
        working-directory: open-brain
        run: npm ci

      - name: Typecheck
        working-directory: open-brain
        run: npx tsc --noEmit

      # tsc --noEmit reads src/ only; tests/ are checked by their own config (T-152).
      - name: Typecheck tests
        working-directory: open-brain
        run: npm run typecheck:tests

      - name: Test
        working-directory: open-brain
        run: npm test -- --reporter=verbose

  # Windows, on the laptop runner (laptop-win). Opt-in: only a dispatch with windows=true runs it, so a new
  # platform cannot block D-032's merge gate while it proves itself. Its jobs are firewalled from every private
  # network by a rule scoped to the runner service (planner session 109). The first step proves it, like tcm's.
  test-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: [self-hosted, Windows, laptop]
    defaults:
      run:
        shell: cmd
    steps:
      - name: Egress isolation self-check (laptop)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          function Try-Tcp($h, $p) {
            $c = New-Object System.Net.Sockets.TcpClient
            try { $t = $c.ConnectAsync($h, $p); if ($t.Wait(4000) -and $c.Connected) { 'connected' } else { 'no-connect' } }
            catch { 'no-connect' } finally { $c.Close() }
          }
          $fail = 0
          foreach ($t in @('100.124.212.87:4000','100.124.212.87:22','192.168.1.50:4000','100.73.250.101:22','192.168.1.1:80','100.100.100.100:53')) {
            $h, $p = $t.Split(':')
            if ((Try-Tcp $h ([int]$p)) -eq 'connected') { "::error::reachable from the runner: $t"; $fail = 1 } else { "blocked: $t" }
          }
          exit $fail

      - uses: actions/checkout@v4
        with:
          # Full history: tests resolve revisions (git rev-parse of an older sha). The default depth of 1 failed 8 tests on
          # a hosted runner, where tcm's persistent workspace had the history (T-227 addendum, run 36984810269).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: open-brain/package-lock.json

      - name: Install
        working-directory: open-brain
        run: npm ci

      - name: Typecheck
        working-directory: open-brain
        run: npx tsc --noEmit

      - name: Typecheck tests
        working-directory: open-brain
        run: npm run typecheck:tests

      # Step 0 counts only on a quiet laptop (R89 item 4). This records the baseline and MARKS a run that is not quiet;
      # it does not fail it, because whether a row counts is the handoff's call, made from this log.
      - name: Laptop baseline (CPU, free RAM, top 5 by CPU)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          Start-Sleep -Seconds 5
          $loads = 1..3 | ForEach-Object { (Get-CimInstance Win32_Processor | Measure-Object LoadPercentage -Average).Average; Start-Sleep -Seconds 2 }
          $cpu = [math]::Round(($loads | Measure-Object -Average).Average, 1)
          $os = Get-CimInstance Win32_OperatingSystem
          $freeMb = [math]::Round($os.FreePhysicalMemory / 1024)
          $totalMb = [math]::Round($os.TotalVisibleMemorySize / 1024)
          "BASELINE cpu_load_pct=$cpu samples=$($loads -join ',') free_ram_mb=$freeMb total_ram_mb=$totalMb at=$((Get-Date).ToUniversalTime().ToString('o'))"
          $top = Get-CimInstance Win32_PerfFormattedData_PerfProc_Process |
            Where-Object { $_.Name -notin '_Total','Idle' } |
            Sort-Object PercentProcessorTime -Descending | Select-Object -First 5
          $top | ForEach-Object { "TOP5 $($_.Name) pid=$($_.IDProcess) cpu_pct=$($_.PercentProcessorTime) ws_mb=$([math]::Round($_.WorkingSet / 1MB))" }
          # PercentProcessorTime is percent of ONE logical processor, so 15 means 15 % of a core, as the handoff states.
          # Dividing it by the processor count made this 120 % of a core on the 8-thread laptop (QA 123, E-4).
          $heavy = $top | Where-Object { $_.Name -notmatch '^(Runner\.|powershell|WmiPrvSE)' -and $_.PercentProcessorTime -gt 15 }
          if ($cpu -gt 25 -or $heavy) { "::warning::BASELINE_NOT_QUIET cpu_load_pct=$cpu heavy=$(($heavy | ForEach-Object Name) -join ',') - this run does not count for Step 0" }
          else { "BASELINE_QUIET" }

      - name: Test
        if: ${{ !inputs.step0 }}
        working-directory: open-brain
        run: npm test -- --testTimeout=30000 --maxWorkers=${{ inputs.workers || '2' }}

      # The load runs for the suite's whole duration: the generator wraps the suite, stops its children when the suite
      # exits, proves them dead, and exits with the suite's code (90/91 if the load leaked or was not as stated).
      - name: Test under generated load (Step 0)
        if: ${{ inputs.step0 }}
        working-directory: open-brain
        env:
          OPEN_BRAIN_ELD_DIR: ${{ runner.temp }}\step0\eld
        run: >-
          node scripts/load-generator.mjs --cpu ${{ inputs.cpu }} --disk ${{ inputs.disk }} --spawn ${{ inputs.spawn }}
          --duration 2700 --report "${{ runner.temp }}\step0\loadgen.json" --log "${{ runner.temp }}\step0\suite.log"
          -- npm test -- --testTimeout=30000 ${{ inputs.workers && format('--maxWorkers={0}', inputs.workers) || '' }}

      # An instrument independent of the generator's own report: every child PID it launched must be gone now.
      - name: Step 0 check (children dead, summary)
        if: ${{ always() && inputs.step0 }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'step0'
          $reportPath = Join-Path $dir 'loadgen.json'
          if (-not (Test-Path $reportPath)) { "::error::no load-generator report at $reportPath"; exit 1 }
          $r = Get-Content $reportPath -Raw | ConvertFrom-Json
          $left = @($r.children | Where-Object { Get-Process -Id $_.pid -ErrorAction SilentlyContinue | Where-Object ProcessName -eq 'node' })
          "PARAMS cpu=$($r.params.cpu) disk=$($r.params.disk) spawn=$($r.params.spawn) children=$(@($r.children).Count) started=$($r.startedAt) stopped=$($r.stoppedAt)"
          "SUITE_EXIT=$($r.commandExit) capped=$($r.cappedByDuration) deadBeforeStop=$(@($r.deadBeforeStop).Count) leakedByReport=$(@($r.leaked).Count) aliveNow=$($left.Count)"
          $log = Join-Path $dir 'suite.log'
          if (Test-Path $log) {
            "ON_TASK_UPDATE_TIMEOUTS=$(@(Select-String -Path $log -Pattern 'Timeout calling \"onTaskUpdate\"').Count)"
            Select-String -Path $log -Pattern '(Test Files|\sTests\s|Errors\s|Duration\s)' | Select-Object -Last 6 | ForEach-Object { "VITEST $($_.Line.Trim())" }
          }
          $rows = Get-ChildItem (Join-Path $dir 'eld') -Filter *.jsonl -ErrorAction SilentlyContinue | Get-Content | ForEach-Object { $_ | ConvertFrom-Json }
          "ELD rows=$(@($rows).Count); top 10 by gapMaxMs:"
          $rows | Sort-Object gapMaxMs -Descending | Select-Object -First 10 | ForEach-Object {
            "ELD gap=$($_.gapMaxMs) eldMax=$($_.eldMaxMs) p99=$($_.eldP99Ms) wall=$($_.wallMs) pid=$($_.pid) ended=$($_.gapMaxEndedAt) $(Split-Path $_.file -Leaf)"
          }
          if ($left.Count -gt 0) { "::error::load-generator children still alive: $(($left | ForEach-Object pid) -join ',')"; exit 1 }

      - name: Upload Step 0 artifacts
        if: ${{ always() && inputs.step0 }}
        uses: actions/upload-artifact@v4
        with:
          name: step0-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\step0
          if-no-files-found: warn
