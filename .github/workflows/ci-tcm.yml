name: CI (tcm, self-hosted)

# Proof run for the self-hosted runner on tcm (docs/loops/infra-tcm-runner-brief.md, D-043).
# The same steps as ci.yml, on [self-hosted, linux, tcm]. It triggers on push to its own branch
# because GitHub will not dispatch a workflow that exists only on a non-default branch.
on:
  push:
    branches: [chore/tcm-runner]
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, linux, tcm]

    steps:
      # The runner user is firewalled to the public internet only. If any of these connects,
      # the isolation is gone and the job must not run the repository's code.
      - name: Egress isolation self-check
        run: |
          fail=0
          for t in 127.0.0.1/3210 172.20.0.2/3210 172.20.0.2/3211 172.20.0.3/4000 127.0.0.1/4000 \
                   192.168.1.50/4000 100.124.212.87/4000 127.0.0.1/80 127.0.0.1/81; do
            if timeout 5 bash -c "exec 3<>/dev/tcp/$t" 2>/dev/null; then
              echo "::error::reachable from the runner: $t"; fail=1
            else
              echo "blocked: $t"
            fi
          done
          if ls /opt/doorctl >/dev/null 2>&1; then echo "::error::/opt/doorctl is readable"; fail=1; else echo "denied: /opt/doorctl"; fi
          exit "$fail"

      - name: Runner facts
        run: |
          echo "runner: $RUNNER_NAME, user $(id -un), nproc $(nproc)"
          git --version
          echo "system node: $(node --version 2>/dev/null || echo none)"

      - uses: actions/checkout@v4

      # Node 22 LTS, the same as ci.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: open-brain/package-lock.json

      - name: Node version used
        run: node --version

      - name: Install
        working-directory: open-brain
        run: npm ci

      - name: Typecheck
        working-directory: open-brain
        run: npx tsc --noEmit

      - name: Test
        working-directory: open-brain
        run: npm test
